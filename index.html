<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191919">
  <title>Water, gently.</title>
  <style>
    :root { color-scheme:dark; --line:#3a3a3a; --ink:#f2f2f2; --muted:#a0a0a0; --track:#393939; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:transparent; color:var(--ink); font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif; display:grid; place-items:center; }
    main { width:min(100%,440px); padding:26px 20px 30px; }
    header { display:flex; justify-content:space-between; align-items:start; margin-bottom:26px } h1 { font-size:25px; letter-spacing:-.7px; margin:0 0 4px } p { margin:0; color:var(--muted) } .date { font-size:13px; text-align:right; color:var(--muted) }
    .card { border:1px solid var(--line); border-radius:28px; padding:25px; }
    .progress { display:grid; place-items:center; position:relative; margin:4px auto 19px; width:205px; aspect-ratio:1; }
    .progress:before { content:""; position:absolute; inset:0; border-radius:50%; background:conic-gradient(var(--ink) calc(var(--progress)*1%),var(--track) 0); -webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 13px),#000 calc(100% - 12px)); mask:radial-gradient(farthest-side,#0000 calc(100% - 13px),#000 calc(100% - 12px)); }
    .amount { z-index:1; text-align:center } .amount strong { display:block; font-size:42px; letter-spacing:-2px; line-height:1 } .amount span { color:var(--muted); font-size:14px }
    .message { text-align:center; min-height:24px; font-size:14px; color:var(--muted); margin-bottom:20px }
    .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:9px } button { border:1px solid var(--line); border-radius:16px; padding:13px 7px; font:inherit; font-weight:700; color:var(--ink); background:transparent; cursor:pointer; transition:transform .15s,background .15s } button:hover { background:#ffffff12 } button:active { transform:scale(.96) } button.add { border-color:#858585; font-size:17px } button small { display:block; font-weight:500; font-size:11px; opacity:.75 }
    .footer { display:flex; align-items:center; justify-content:space-between; margin-top:17px; gap:12px } .goal { font-size:13px; color:var(--muted) } .reset { background:none; border:1px solid var(--line); color:var(--muted); padding:7px 10px; border-radius:10px; font-size:12px }
    details { margin-top:18px; border:1px solid var(--line); border-radius:16px; padding:0 14px; color:var(--muted); font-size:13px } summary { cursor:pointer; padding:12px 0; color:var(--ink); font-weight:650 } label { display:flex; gap:9px; align-items:center; padding:0 0 13px } input { width:68px; padding:6px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); font:inherit }
    @media (max-width:360px) { main { padding:18px 13px } .card { padding:20px } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>Water, gently.</h1><p>A small sip at a time.</p></div><div class="date" id="date"></div></header>
    <section class="card" aria-label="Water intake tracker">
      <div class="progress" id="ring" style="--progress:0"><div class="amount"><strong id="amount">0</strong><span>of <b id="goalText">2,000</b> ml</span></div></div>
      <div class="message" id="message" aria-live="polite">Start with one glass.</div>
      <div class="actions"><button data-add="250">+ 1 glass<small>250 ml</small></button><button class="add" data-add="500">+ 2 glasses<small>500 ml</small></button><button data-add="750">+ bottle<small>750 ml</small></button></div>
      <div class="footer"><span class="goal" id="glasses">0 of 8 glasses</span><button class="reset" id="reset">Reset today</button></div>
    </section>
    <details><summary>Daily goal</summary><label>Millilitres <input id="goal" type="number" min="250" max="10000" step="250" value="2000"></label></details>
  </main>
  <script>
    const $ = id => document.getElementById(id), key = 'water-gently';
    const today = new Date().toISOString().slice(0,10);
    let data = JSON.parse(localStorage.getItem(key) || '{}');
    if (data.date !== today) data = { date: today, amount: 0, goal: data.goal || 2000 };
    const save = () => localStorage.setItem(key, JSON.stringify(data));
    function render() {
      const pct = Math.min(100, Math.round(data.amount / data.goal * 100));
      $('ring').style.setProperty('--progress', pct); $('amount').textContent = data.amount.toLocaleString();
      $('goalText').textContent = data.goal.toLocaleString(); $('goal').value = data.goal;
      $('glasses').textContent = `${(data.amount / 250).toFixed(data.amount % 250 ? 1 : 0)} of ${data.goal / 250} glasses`;
      $('message').textContent = data.amount >= data.goal ? 'Goal reached — lovely work.' : data.amount ? `${data.goal - data.amount} ml to go. Keep it easy.` : 'Start with one glass.';
      save();
    }
    document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { data.amount += +b.dataset.add; render(); });
    $('reset').onclick = () => { data.amount = 0; render(); };
    $('goal').onchange = e => { data.goal = Math.max(250, Math.min(10000, +e.target.value || 2000)); render(); };
    $('date').textContent = new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date()); render();
  </script>
</body>
</html>
